blueprint:
  name: Motion-driven cover (sun offset)
  description: >
    On motion, open covers during daylight (sunrise + offset through sunset − offset)
    and close them at night. Skips action when any configured window is open or while
    a manual-override timer is running after a user-adjusted cover move.
  domain: automation
  input:
    motion_sensors:
      name: Motion sensor(s)
      description: Motion sensors that trigger cover adjustment.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class:
                - motion
                - occupancy
                - presence
    covers:
      name: Cover(s)
      description: Covers to open or close based on sun position.
      selector:
        entity:
          multiple: true
          filter:
            - domain: cover
    manual_override_duration:
      name: Manual override duration
      description: >
        After a manual cover change, automation is suppressed for this long.
      default: "00:15:00"
      selector:
        duration:
    manual_override_timer:
      name: Manual override timer
      description: >
        Create a Timer helper (Settings → Helpers → Timer) for this automation.
        It is started when a cover is moved manually and blocks automated moves until it finishes.
      selector:
        entity:
          filter:
            - domain: timer
    windows:
      name: Window sensor(s) (optional)
      description: >
        Binary sensors that are on when a window is open (for example
        binary_sensor.a128_2_a128_input39). Leave empty to ignore windows.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    sun_offset:
      name: Sun offset (minutes)
      description: >
        Minutes after sunrise before covers may open, and minutes before sunset when
        daylight ends (covers close). Use 0 for exact sunrise/sunset.
      default: 0
      selector:
        number:
          min: 0
          max: 180
          step: 1
          mode: slider
          unit_of_measurement: min
    manual_override_detection:
      name: Manual override detection
      description: >
        Shelly and similar covers often change current_position without changing
        open/closed state. Use "Shelly / position" if manual moves are not detected.
      default: standard
      selector:
        select:
          mode: dropdown
          options:
            - label: Standard (context-based)
              value: standard
            - label: Shelly / position changes
              value: shelly_position

variables:
  window_list: !input windows
  cover_list: !input covers
  sun_offset_minutes: !input sun_offset
  override_detection: !input manual_override_detection

triggers:
  - id: motion_detected
    trigger: state
    entity_id: !input motion_sensors
    from: "off"
    to: "on"
  - id: cover_manual
    trigger: state
    entity_id: !input covers
  - id: cover_manual
    trigger: state
    entity_id: !input covers
    attribute: current_position
  - id: cover_manual
    trigger: event
    event_type: call_service
    event_data:
      domain: cover

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: cover_manual
          - condition: template
            value_template: >
              {% if trigger.platform == 'event' %}
                {% set ctx = trigger.event.context %}
                {% set data = trigger.event.data %}
                {% set svc = data.service %}
                {% if svc not in ['open_cover', 'close_cover', 'set_cover_position', 'stop_cover', 'toggle'] %}
                  false
                {% else %}
                  {% set raw = data.service_data.entity_id | default([], true) %}
                  {% set ids = [raw] if raw is string else (raw if raw is iterable else []) %}
                  {% set wanted = cover_list %}
                  {% set hit = ids | select('in', wanted) | list | length > 0 %}
                  {% set pid = ctx.parent_id | default(none, true) %}
                  {{ hit and (pid is none or pid == '') }}
                {% endif %}
              {% else %}
                {% set ctx = trigger.context %}
                {% set pid = ctx.parent_id | default(none, true) %}
                {% if override_detection == 'shelly_position' and trigger.attribute == 'current_position' %}
                  true
                {% else %}
                  {{ pid is none or pid == '' }}
                {% endif %}
              {% endif %}
        sequence:
          - action: timer.start
            target:
              entity_id: !input manual_override_timer
            data:
              duration: !input manual_override_duration
      - conditions:
          - condition: trigger
            id: motion_detected
        sequence:
          - condition: state
            entity_id: !input manual_override_timer
            state: idle
          - condition: template
            value_template: >
              {% if window_list | length == 0 %}
                true
              {% else %}
                {{ expand(window_list) | selectattr('state', 'eq', 'on') | list | length == 0 }}
              {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {% set offset = (sun_offset_minutes | int(0)) * 60 %}
                      {% set now_ts = as_timestamp(now()) %}
                      {% set next_rising = as_timestamp(state_attr('sun.sun', 'next_rising')) %}
                      {% set next_setting = as_timestamp(state_attr('sun.sun', 'next_setting')) %}
                      {% if is_state('sun.sun', 'above_horizon') %}
                        {% set sunset_ts = next_setting %}
                        {% if next_rising > next_setting %}
                          {% set sunrise_ts = next_rising - 86400 %}
                        {% else %}
                          {% set sunrise_ts = next_rising %}
                        {% endif %}
                      {% else %}
                        {% if next_rising < next_setting %}
                          {% set sunrise_ts = next_rising %}
                          {% set sunset_ts = next_setting %}
                        {% else %}
                          {% set sunrise_ts = next_rising - 86400 %}
                          {% set sunset_ts = next_setting - 86400 %}
                        {% endif %}
                      {% endif %}
                      {% set day_start = sunrise_ts + offset %}
                      {% set day_end = sunset_ts - offset %}
                      {{ day_start <= now_ts <= day_end }}
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: !input covers
              - conditions: []
                sequence:
                  - action: cover.close_cover
                    target:
                      entity_id: !input covers

mode: queued
max: 5